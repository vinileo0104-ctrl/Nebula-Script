<svg id="nebula-logo-svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Gradients -->
                            <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"></stop>
                                <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"></stop>
                                <stop offset="100%" stop-color="#0d1117" stop-opacity="0"></stop>
                            </radialGradient>
                            
                            <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#22d3ee"></stop>
                                <stop offset="50%" stop-color="#a855f7"></stop>
                                <stop offset="100%" stop-color="#ec4899"></stop>
                            </linearGradient>

                            <linearGradient id="nPathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"></stop>
                                <stop offset="100%" stop-color="#c084fc"></stop>
                            </linearGradient>

                            <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                            </filter>
                        </defs>

                        <!-- Background Glow & Stars -->
                        <rect width="512" height="512" rx="100" fill="#0b0e14"></rect>
                        <circle cx="256" cy="256" r="220" fill="url(#nebulaGlow)"></circle>
                        
                        <!-- Constellation Stars -->
                        <circle cx="120" cy="140" r="3" fill="#67e8f9" opacity="0.8"></circle>
                        <circle cx="390" cy="110" r="2" fill="#f472b6" opacity="0.9"></circle>
                        <circle cx="410" cy="380" r="3" fill="#a855f7" opacity="0.7"></circle>
                        <circle cx="100" cy="360" r="2.5" fill="#38bdf8" opacity="0.8"></circle>

                        <!-- Outer Orbital Nebula Ring -->
                        <path d="M 120 256 C 120 130, 392 130, 392 256 C 392 382, 120 382, 120 256 Z" fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="600 120" transform="rotate(-28 256 256)" filter="url(#glowEffect)"></path>

                        <!-- Code Brackets { } in Background -->
                        <text x="75" y="280" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="110" font-weight="bold" opacity="0.3">{</text>
                        <text x="375" y="280" fill="#ec4899" font-family="'Fira Code', monospace" font-size="110" font-weight="bold" opacity="0.3">}</text>

                        <!-- Stylized Modern 'N' Vector -->
                        <path d="M 170 360 L 170 152 C 170 152, 225 152, 256 215 L 342 360 L 342 152" fill="none" stroke="url(#nPathGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"></path>
                        
                        <!-- Core Star Sparkle -->
                        <polygon points="256,120 262,138 280,144 262,150 256,168 250,150 232,144 250,138" fill="#22d3ee" filter="url(#glowEffect)"></polygon>
                    </svg>